name: Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build:frontend
      # 本番のドメイン等は公開リポジトリに含めないため、GitHub Secretsからwrangler.tomlへ差し込む
      - name: Inject production values into wrangler.toml
        working-directory: backend
        env:
          PROD_HOSTNAME: ${{ secrets.PROD_HOSTNAME }}
          RESEND_FROM_ADDRESS: ${{ secrets.RESEND_FROM_ADDRESS }}
          LINE_INVITE_URL: ${{ secrets.LINE_INVITE_URL }}
          ACCESS_TEAM_DOMAIN: ${{ secrets.ACCESS_TEAM_DOMAIN }}
        run: |
          sed -i \
            -e "s|reminder\.example\.com|${PROD_HOSTNAME:?}|g" \
            -e "s|reminder@example\.com|${RESEND_FROM_ADDRESS:?}|" \
            -e "s|https://line\.me/R/ti/p/@example|${LINE_INVITE_URL:?}|" \
            -e "s|example\.cloudflareaccess\.com|${ACCESS_TEAM_DOMAIN:?}|" \
            wrangler.toml
          ! grep -n "example" wrangler.toml
      - name: Apply D1 migrations
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: backend
          command: d1 migrations apply maintenance-reminder-db --remote
      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: backend
          command: deploy
