  <!-- アプリ名 -->
  <text x="540" y="502" text-anchor="middle" font-family="Yu Gothic UI, Yu Gothic, Meiryo, sans-serif" font-size="64" font-weight="bold" fill="#ffffff">お手入れリマインダー</text>
