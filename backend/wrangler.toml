name = "maintenance-reminder"
main = "src/index.ts"
compatibility_date = "2026-07-01"
workers_dev = false

[[routes]]
pattern = "reminder.example.com"
custom_domain = true

[assets]
directory = "../frontend/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/feed/*", "/webhook/*"]

[[d1_databases]]
binding = "DB"
database_name = "maintenance-reminder-db"
database_id = "d298b465-997d-471e-9f76-439135b9e758"

[triggers]
crons = ["*/30 * * * *"]

[vars]
RESEND_FROM_ADDRESS = "reminder@example.com"
