name = "maintenance-reminder"
main = "src/index.ts"
compatibility_date = "2026-07-01"
workers_dev = false

[[routes]]
pattern = "reminder.example.com"
custom_domain = true

[assets]
directory = "../frontend/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/feed/*", "/webhook/*"]

[[d1_databases]]
binding = "DB"
database_name = "maintenance-reminder-db"
database_id = "d298b465-997d-471e-9f76-439135b9e758"

[triggers]
crons = ["*/30 * * * *"]

# routesのpatternと以下のvarsはプレースホルダー。本番の値はGitHub Actions(deploy.yml)が
# デプロイ直前にGitHub Secretsから差し込む。そのためローカルから直接 wrangler deploy しないこと。
[vars]
RESEND_FROM_ADDRESS = "reminder@example.com"
APP_BASE_URL = "https://reminder.example.com"
# ADMIN_EMAIL(管理画面を使えるメールアドレス)は個人情報のためvarsに書かず、
# 本番は `wrangler secret put ADMIN_EMAIL`、ローカルは .dev.vars で設定する
LINE_INVITE_URL = "https://line.me/R/ti/p/@example"
