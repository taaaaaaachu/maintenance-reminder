name = "maintenance-reminder"
main = "src/index.ts"
compatibility_date = "2026-07-01"

[assets]
directory = "../frontend/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/feed/*"]

[[d1_databases]]
binding = "DB"
database_name = "maintenance-reminder-db"
database_id = "REPLACE_WITH_D1_DATABASE_ID"

[triggers]
crons = ["0 22 * * *"]

[vars]
RESEND_FROM_ADDRESS = "reminder@your-domain.example"
